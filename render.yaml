services:
  - type: web
    name: casino-slot-vietnam
    runtime: node
    buildCommand: npm install
    startCommand: node server/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: ADMIN_ID
        sync: false
