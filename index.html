<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ead8b4">
<meta name="description" content="CASINO SLOT VIETNAM - game Xu ảo tối ưu Telegram, animation và SFX nhẹ">
<title>CASINO SLOT VIETNAM</title>
<link rel="stylesheet" href="/styles.css?v=18.0.1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app" class="shell">
  <header class="topbar">
    <div class="brand-mark">♛</div>
    <div class="brand-copy"><strong>CASINO SLOT VIETNAM</strong><span>Sảnh casino cổ điển · Xu ảo</span></div>
    <div class="top-actions">
      <button id="soundToggle" class="icon-btn" aria-label="Âm thanh">🔊</button>
      <button id="themeToggle" class="icon-btn" aria-label="Giao diện">☼</button>
    </div>
  </header>
  <section class="profile-bar panel">
    <div class="avatar" id="avatar">◆</div>
    <div class="who">
      <div class="hello">Xin chào</div><div id="name" class="name">Người chơi</div>
      <div class="meta"><span id="vip">VIP 0</span><span>·</span><span>Cấp <b id="level">1</b></span><span>·</span><span id="usernameTag">@chưa-đặt</span></div>
    </div>
    <div class="wallet"><small>Số dư</small><strong id="balance">50.000 Xu</strong><span id="petBonus">Pet +0% Xu · +0% XP</span></div>
    <button id="dailyBtn" class="gold-btn">🎁</button>
  </section>

  <nav class="nav panel" id="mainNav" aria-label="Điều hướng">
    <button class="nav-item active" data-view="home">⌂<span>Trang chủ</span></button>
    <button class="nav-item" data-view="games">♛<span>Game</span></button>
    <button class="nav-item" data-view="rewards">🎁<span>Thưởng</span></button>
    <button class="nav-item" data-view="rank">🏆<span>BXH</span></button>
    <button class="nav-item" data-view="pets">🐾<span>Pet</span></button>
    <button class="nav-item" data-view="bank">🏦<span>Ngân hàng</span></button>
    <button class="nav-item" data-view="profile">⚙<span>Cá nhân</span></button>
  </nav>

  <main id="view" class="view"></main>
  <footer class="footer">Xu ảo · Không nạp/rút tiền thật · Chủ bot: @itznvl</footer>
</div>
<div id="toast" class="toast" aria-live="polite"></div>
<script type="module" src="/app.js?v=18.0.1"></script>
</body>
</html>
