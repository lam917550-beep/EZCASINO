<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#070a10">
<meta name="color-scheme" content="dark light">
<title>CASINO SLOT VIETNAM</title>
<link rel="stylesheet" href="/styles.css?v=6">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="app" id="app">
<header class="topbar">
  <div class="brand-block"><div class="brand-mark">♠</div><div><div class="brand">CASINO SLOT VIETNAM</div><div class="subbrand">Sân chơi Xu ảo · tối ưu máy yếu</div></div></div>
  <div class="top-actions"><button class="icon-btn" id="audio" type="button" aria-label="Âm thanh">🔊</button><button class="icon-btn" id="theme" type="button" aria-label="Giao diện">☾</button></div>
</header>
<section class="profile-card">
  <div class="profile-left"><div class="avatar" id="avatar">♠</div><div><div class="hello">Xin chào</div><div class="name" id="name">Người chơi</div><div class="chips"><span class="vip-chip" id="vip">VIP 0</span><span>Cấp <b id="level">1</b></span></div></div></div>
  <div class="balance-wrap"><div class="muted">Số dư</div><div class="balance" id="balance">100.000 Xu</div></div>
</section>
<div class="ticker"><span>●</span><span id="tickerText">Sảnh sẵn sàng · chúc bạn vui vẻ</span></div>
<nav class="nav" id="nav"><button class="active" data-v="home">Trang chủ</button><button data-v="games">Game</button><button data-v="tasks">Nhiệm vụ</button><button data-v="rank">Xếp hạng</button><button data-v="profile">Cá nhân</button></nav>
<main id="view" class="view"></main>
<div id="modal-root"></div><div id="toast" class="toast"></div>
<footer class="footer">Xu ảo · Không nạp/rút tiền thật · Chơi giải trí · Chủ bot: @itznvl</footer>
</div>
<script type="module" src="/app.js?v=6"></script>
</body>
</html>
