<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070a10">
<meta name="color-scheme" content="dark light">
<title>CASINO SLOT VIETNAM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/styles.css?v=5">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="brand-chip">CV</span><div><strong>CASINO SLOT</strong><small>VIETNAM · XU ẢO</small></div></div>
    <div class="actions-top"><button id="audio" class="round" aria-label="Âm thanh">🔊</button><button id="theme" class="round" aria-label="Chế độ sáng tối">☾</button></div>
  </header>
  <section class="wallet">
    <div class="avatar" id="avatar">🎰</div>
    <div class="identity"><small>XIN CHÀO</small><h1 id="name">Người chơi</h1><div><span id="vip">VIP 0</span><i>•</i><span>Cấp <b id="level">1</b></span></div></div>
    <div class="balance"><small>SỐ DƯ</small><strong id="balance">100.000 Xu</strong></div>
  </section>
  <section class="ticker"><span class="dot"></span><span id="tickerText">Sảnh đang sẵn sàng</span></section>
  <main id="view"></main>
  <nav id="nav" class="nav">
    <button data-v="home" class="active"><b>⌂</b><small>Trang chủ</small></button>
    <button data-v="games"><b>♠</b><small>Trò chơi</small></button>
    <button data-v="tasks"><b>✦</b><small>Nhiệm vụ</small></button>
    <button data-v="rank"><b>♛</b><small>Xếp hạng</small></button>
    <button data-v="profile"><b>◉</b><small>Cá nhân</small></button>
  </nav>
</div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js?v=5"></script>
</body>
</html>
