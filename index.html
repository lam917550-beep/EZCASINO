<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#20262e">
<meta name="color-scheme" content="dark light">
<title>CASINO SLOT VIETNAM</title>
<link rel="stylesheet" href="/styles.css?v=8">
<link rel="preconnect" href="https://telegram.org">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
<header class="topbar">
  <div class="brand-wrap"><div class="brand-gem">◆</div><div><div class="brand">CASINO SLOT VIETNAM</div><div class="tagline">Sảnh Xu ảo · siêu nhẹ cho máy yếu</div></div></div>
  <div class="top-actions"><button id="audio" class="tool-btn" type="button">🔊</button><button id="theme" class="tool-btn" type="button">☼</button></div>
</header>
<section class="playerbar">
  <div class="avatar" id="avatar">◆</div>
  <div class="identity"><div class="hello">Xin chào</div><div class="player-name" id="name">Người chơi</div><div class="mini-chips"><span id="vip">VIP 0</span><span>Cấp <b id="level">1</b></span><span id="petBonus">Pet +0%</span></div></div>
  <div class="balance"><span class="muted">Số dư</span><strong id="balance">100.000 Xu</strong></div>
</section>
<div class="ticker"><span>●</span><span id="tickerText">Sảnh sẵn sàng</span></div>
<nav id="nav" class="nav"><button class="active" data-v="home">⌂</button><button data-v="games">🎮</button><button data-v="tasks">✦</button><button data-v="rank">♛</button><button data-v="profile">◉</button></nav>
<main id="view"></main>
<div id="modal-root"></div><div id="toast" class="toast"></div>
<footer>Xu ảo · Không nạp/rút tiền thật · Chủ bot: @itznvl</footer>
</div>
<script type="module" src="/app.js?v=8"></script>
</body>
</html>
