<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập — CASINO SLOT VIETNAM</title><link rel="stylesheet" href="/styles.css?v=13.0.0"></head><body><div style="max-width:460px;margin:10vh auto;padding:16px"><section class="sheet" style="border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)"><div class="brand"><span class="brand-orb">♛</span><div><strong>CASINO SLOT VIETNAM</strong><small>Đăng nhập web</small></div></div><h2>Đăng nhập</h2><input id="username" class="input" placeholder="Username"><input id="password" class="input" style="margin-top:7px" type="password" placeholder="Mật khẩu 8+ ký tự"><button id="login" class="primary wide" style="margin-top:8px">ĐĂNG NHẬP</button><p id="msg" style="font-size:10px;color:var(--muted)"></p><small>Telegram Mini App không cần nhập mật khẩu.</small></section></div><script>document.querySelector('#login').onclick=async()=>{const msg=document.querySelector('#msg');msg.textContent='Đang đăng nhập…';const r=await fetch('/api/web/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});const d=await r.json();if(!r.ok){msg.textContent=d.error||'Đăng nhập thất bại.';return}localStorage.setItem('csv-web-session',d.session);location.href='/'};</script></body></html>
