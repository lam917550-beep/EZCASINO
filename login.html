<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập · CASINO SLOT VIETNAM</title><link rel="stylesheet" href="/styles.css?v=18.0.0"></head>
<body><main class="auth-page"><section class="auth-card"><div class="auth-logo">♛</div><h1>CASINO SLOT VIETNAM</h1><p>Đăng nhập web bằng Username và mật khẩu bạn đã tạo trong Mini App.</p><form id="form"><label>Username<input id="u" autocomplete="username" required maxlength="20"></label><label>Mật khẩu<input id="p" type="password" autocomplete="current-password" minlength="8" required></label><button class="primary full" type="submit">Đăng nhập</button></form><div id="msg" class="notice" hidden></div><a class="secondary full link-btn" href="/">Quay lại</a></section></main><script>
const f=document.getElementById('form'),m=document.getElementById('msg');f.addEventListener('submit',async e=>{e.preventDefault();m.hidden=true;try{const r=await fetch('/api/web/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Đăng nhập thất bại');localStorage.setItem('csv-session',d.session);location.href='/'}catch(err){m.hidden=false;m.textContent=err.message}});
</script></body></html>
